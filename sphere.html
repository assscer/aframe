<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame Sphere</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="components/rotation-component.js"></script>
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <a-scene>
        <a-sphere position="0 1.5 -3" radius="1" color="#FF8800" rotation-component="speed: 1"></a-sphere>
        <a-camera position="0 1.6 2">
            <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
